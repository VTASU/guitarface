[project]
name = "guitar-face"
version = "0.1.0"
description = "Control a MIDI wah pedal with your guitar face."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Guitar Face contributors" }]
dependencies = [
    "mediapipe==1.1.0",
    "numpy>=1.26,<2",
    "platformdirs>=4.3,<5",
    "pyside6==6.11.2",
    "python-rtmidi==1.5.8",
]

[project.scripts]
guitar-face = "guitar_face.app:main"

[dependency-groups]
dev = [
    "pyinstaller==6.22.2",
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_face"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
